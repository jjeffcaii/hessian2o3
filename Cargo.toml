[workspace]
members = [".", "hessian2-derive"]

[package]
name = "hessian2"
version = "0.0.4"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Jeffsky Tsai <jjeffcaii@outlook.com>"]
repository = "https://github.com/jjeffcaii/hessian2o3"
homepage = "https://github.com/jjeffcaii/hessian2o3"
description = "A Rust implementation of Hessian 2.0 Serialization Protocol."
include = [
    "**/*.rs",
    "Cargo.toml",
]

[build-dependencies]
string_cache_codegen = "0.7"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1.15", features = ["write"] }
string_cache = "0.10"
hessian2-derive = { path = "hessian2-derive", version = "0.0.3" }
base64 = "0.22"
indexmap = "2.14"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
pretty_env_logger = "0.5"
chrono = "0.4.45"
assert_matches = "1.5"
serde_json = "1"
hex = "0.4.3"
